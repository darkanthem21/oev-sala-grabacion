# Base común a desarrollo y a los dos servidores.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: oev
      POSTGRES_USER: oev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oev"]
      interval: 2s
      retries: 20
    restart: unless-stopped

  web:
    # La imagen se baja de GHCR; solo el compose de desarrollo la construye.
    # TAG es `main`, una rama publicada o el SHA de un commit.
    image: ghcr.io/darkanthem21/oev-sala-grabacion:${TAG:-main}
    # check --deploy corta el arranque si la configuración es insegura: clave
    # débil, DEBUG o cookies sin Secure.
    command: >
      sh -c "python manage.py check --deploy --fail-level WARNING &&
             python manage.py migrate &&
             { python manage.py createsuperuser --noinput 2>/dev/null || true; } &&
             exec gunicorn oev.wsgi --bind 0.0.0.0:${PUERTO:-3006} --workers ${WEB_CONCURRENCY:-2}"
    environment:
      # Lo único fijo del stack; el resto lo pone el entorno de cada servidor.
      DB_HOST: db
      # Opciones de gunicorn; dentro de `command` YAML partiría la orden.
      # --threads: una subida lenta de fotos ocupa un hilo, no al worker completo.
      # --keep-alive 0: el proxy reutilizaba conexiones ya cerradas (502).
      # --max-requests: recicla cada worker para soltar la memoria de los PDF.
      # --access-logformat: la IP de quien se conecta y la que informa el proxy.
      GUNICORN_CMD_ARGS: >-
        --worker-tmp-dir /dev/shm --threads 4 --keep-alive 0
        --max-requests 500 --max-requests-jitter 50
        --access-logfile -
        --access-logformat '%(h)s %({x-forwarded-for}i)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s"'
    volumes:
      - checkoutmedia:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tareas:
    # US-03: manda los recordatorios cada hora. Es un bucle porque el servidor
    # del curso no tiene cron; la primera vuelta espera a que web migre.
    image: ghcr.io/darkanthem21/oev-sala-grabacion:${TAG:-main}
    command: >
      sh -c "sleep 60;
             while true; do python manage.py recordar_confirmaciones; sleep 3600; done"
    environment:
      DB_HOST: db
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  checkoutmedia:
