# Base, comun a desarrollo y al servidor del curso.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: oev
      POSTGRES_USER: oev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oev"]
      interval: 2s
      retries: 20
    restart: unless-stopped

  web:
    # En el servidor la imagen se baja de GHCR y no se construye nada; el compose
    # de desarrollo agrega `build` para trabajar sobre el codigo local.
    # TAG es la rama publicada, o el sha de un commit para fijar una version
    # exacta. Por defecto `main`: desplegar otra cosa hay que pedirlo a proposito.
    image: ghcr.io/darkanthem21/oev-sala-grabacion:${TAG:-main}
    # runserver sostiene la carga prevista —decenas de personas en horario habil—
    # y el paso a gunicorn queda pendiente. El --insecure es lo que le permite
    # servir los estaticos con DEBUG=0.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput 2>/dev/null;
             python manage.py runserver --insecure 0.0.0.0:${PUERTO:-3006}"
    environment:
      # Unico valor fijo del stack: el resto lo pone el entorno que corresponda.
      DB_HOST: db
    volumes:
      - checkoutmedia:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  checkoutmedia:
