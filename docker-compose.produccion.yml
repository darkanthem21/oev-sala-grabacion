# Servidor propio (no el del curso): Caddy en el mismo stack termina el TLS.
# Requiere Compose v2. Va encima del base, con el .env al lado:
#
#   docker compose -f docker-compose.yml -f docker-compose.produccion.yml up -d
#
# El nombre del proyecto queda fijo en `oev`, así que los volúmenes son
# oev_pgdata y oev_checkoutmedia sin importar la carpeta.
name: oev

# Sin límite, los logs de Docker crecen hasta llenar el disco.
x-logs: &logs
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    env_file: .env
    <<: *logs

  web:
    env_file: .env
    # El servidor tiene 1 GB. Con tope, si un PDF con fotos grandes o una fuga
    # se pasa, cae un worker de web (gunicorn levanta otro) y no la base, que
    # es a quien podría elegir el kernel al quedarse sin memoria.
    mem_limit: 400m
    # La página de ingreso no consulta la base: prueba que gunicorn responde, es
    # decir, que el arranque pasó la revisión y las migraciones. desplegar.sh
    # espera este resultado. Hasta estar sano se revisa cada 2 s.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:3006/solicitante/entrar/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0]}), timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    <<: *logs

  tareas:
    env_file: .env
    mem_limit: 200m
    <<: *logs

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./produccion/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados y claves de ACME: perderlos obliga a pedirlos de nuevo, y
      # Let's Encrypt limita cuántos se pueden pedir por semana.
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
    <<: *logs

volumes:
  caddy_data:
  caddy_config:
