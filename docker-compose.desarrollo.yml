# Desarrollo: build local, codigo montado y DEBUG. Va con -f explicito, y por eso
# ya no se llama 'override': con ese nombre Compose lo cargaba solo, y un
# `docker-compose up` en el servidor construia ahi en vez de bajar la imagen.
#
#   docker compose -f docker-compose.yml -f docker-compose.desarrollo.yml up
#
# Las claves de aca son de juguete a proposito: viven en este archivo, no en el
# base, para que no exista forma de que terminen corriendo en el servidor.
services:
  db:
    environment:
      POSTGRES_PASSWORD: oev

  web:
    build:
      context: .
      # Hay entornos donde el contenedor de build no resuelve DNS y falla al bajar
      # las dependencias. Con la red del host deja de depender de esa configuracion.
      network: host
    ports:
      - "8000:${PUERTO:-3006}"
    environment:
      DEBUG: "1"
      POSTGRES_PASSWORD: oev
      DJANGO_SUPERUSER_EMAIL: admin@uach.cl
      DJANGO_SUPERUSER_PASSWORD: admin
    volumes:
      # El codigo montado permite editar y recargar sin reconstruir la imagen.
      - ./src:/app
