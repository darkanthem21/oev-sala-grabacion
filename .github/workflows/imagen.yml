# Pruebas en cada PR y en main. En main, además, publica la imagen en GHCR y,
# si está activado, la despliega en el servidor propio.
#
# Una rama se publica a mano: Actions > imagen > Run workflow.
#
# Las acciones van fijadas por commit porque una etiqueta se puede mover, y
# este workflow publica la imagen y tiene la clave del servidor.
name: imagen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En fila por rama: si dos merges seguidos publicaran a la vez, el commit viejo
# podría quedar como última versión. En un PR, la corrida nueva cancela la vieja.
concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: oev
          POSTGRES_USER: oev
          POSTGRES_PASSWORD: oev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oev" --health-interval 2s --health-retries 20
    env:
      DB_HOST: localhost
      POSTGRES_PASSWORD: oev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python src/manage.py makemigrations --check --dry-run
      # test_ac3_001 depende del día en que corre y falla también en main; se
      # excluye hasta que lo corrija quien lleva las pruebas.
      - run: >
          pytest -q
          --deselect src/configuracion/tests/test_parametros.py::test_ac3_001_independencia_estado_reservas

  publicar:
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Las etiquetas de Docker no admiten '/' y los nombres de rama sí:
      # feat/us-01-inicio-sesion -> feat-us-01-inicio-sesion
      - id: etiqueta
        run: echo "nombre=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # La de rama se mueve con cada push; la del commit no cambia y es la
          # que se despliega.
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.etiqueta.outputs.nombre }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # Quedan `main` y las 15 versiones más recientes, para volver atrás por
      # SHA. Si la limpieza falla no detiene nada: la imagen ya está publicada.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        continue-on-error: true
        with:
          package-name: oev-sala-grabacion
          package-type: container
          min-versions-to-keep: 15
          ignore-versions: '^main$'

  # Apagado hasta que existan la variable DESPLIEGUE_AUTOMATICO=true y el
  # environment `produccion` con sus secretos (docs/despliegue.md).
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main' && vars.DESPLIEGUE_AUTOMATICO == 'true'
    runs-on: ubuntu-latest
    environment: produccion
    concurrency: produccion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar SSH
        env:
          SSH_CLAVE: ${{ secrets.SSH_CLAVE }}
          SSH_HUELLA: ${{ secrets.SSH_HUELLA }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_CLAVE" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HUELLA" > ~/.ssh/known_hosts
      - name: Copiar el stack y desplegar
        env:
          DESTINO: ${{ secrets.SSH_USUARIO }}@${{ secrets.SSH_HOST }}
        run: |
          scp -q docker-compose.yml docker-compose.produccion.yml "$DESTINO:oev/"
          scp -q produccion/* "$DESTINO:oev/produccion/"
          ssh "$DESTINO" "sh oev/produccion/desplegar.sh ${{ github.sha }}"
