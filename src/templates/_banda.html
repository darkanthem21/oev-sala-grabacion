{% load static %}{% comment %}
  La banda naranja que abre toda pantalla con sesión, con el logo blanco oficial
  de la Facultad. Debajo, cada cascarón pone su riel: pestañas y _rol.html.
{% endcomment %}
<div class="banda">
  <div class="dentro">
    <img class="sello" src="{% static 'img/Facultad-color-blanco.png' %}"
         alt="Facultad de Ciencias de la Ingeniería, Universidad Austral de Chile">
    <h1 class="producto">Sala de grabación</h1>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}<button class="btn" type="submit">Cerrar sesión</button>
    </form>
  </div>
</div>
