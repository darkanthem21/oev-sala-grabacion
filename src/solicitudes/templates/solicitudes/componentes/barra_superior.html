{% load static %}
<header class="barra-superior" role="banner">
  <div class="barra-superior-interior">
    <div class="barra-superior-izquierda">
      <a href="{% url 'solicitar' %}" class="barra-logo-enlace" aria-label="Sala de grabación OEV - Inicio">
        <img class="barra-logo"
             src="{% static 'img/Facultad-color-negro.png' %}"
             alt="Universidad Austral de Chile · Facultad de Ciencias de la Ingeniería">
      </a>
    </div>

    <div class="barra-superior-derecha">
      {% if user.is_authenticated %}
        {% if request.path|slice:":11" == "/solicitar/" %}
          {% url 'mis_solicitudes' as url_historial %}
          <a class="barra-enlace" href="{{ url_historial }}"
             {% if request.path == url_historial %}aria-current="page"{% endif %}>Mis solicitudes</a>
        {% endif %}
        <div class="barra-usuario-info">
          <svg class="barra-usuario-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="barra-usuario-correo" title="{{ user.email }}">{{ user.email }}</span>
        </div>

        <form class="barra-logout-form" action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button type="submit" class="btn-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg class="icono-logout" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar sesión</span>
          </button>
        </form>
      {% endif %}
    </div>
  </div>
</header>
